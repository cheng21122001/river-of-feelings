<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>第无数次踏入同一条河流</title>
<meta name="description" content="记录每天的心情。">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#070707" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#e7e7e1" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="河">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">

<script>
  /* 在 CSS 之前定主题，避免打开时闪一下 */
  (function(){try{var t=localStorage.getItem("river_theme");
  if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- 河流：铺满视口的透明背景，压在所有内容底下 -->
<canvas id="scene-canvas" aria-hidden="true"></canvas>

<!-- ========== 河 ========== -->
<main class="page" id="page-today">
  <div class="wrap">
    <header>
      <h1 class="title">第无数次踏入同一条河流</h1>
    </header>

    <div class="ask">
      <div class="date" id="today"></div>
      <div class="moods" id="moods">
        <div class="mood" data-m="happy" role="button" tabindex="0"><span class="ind"><span class="disc"></span></span>快乐</div>
        <div class="mood" data-m="calm" role="button" tabindex="0"><span class="ind"><span class="bar"></span></span>平静</div>
        <div class="mood" data-m="low" role="button" tabindex="0"><span class="ind"><span class="ring"></span></span>不妙</div>
      </div>
      <textarea id="note" placeholder="（可留空）"></textarea>
      <div class="row">
        <button class="primary" id="save">记下这一刻</button>
        <button class="ghost" id="clearSel">取消</button>
      </div>
    </div>

    <div class="ledger">
      <div class="tally"><b id="sHappy">0</b><span>快乐</span></div>
      <div class="tally"><b id="sCalm">0</b><span>平静</span></div>
      <div class="tally"><b id="sLow">0</b><span>不妙</span></div>
    </div>

    <div class="section-h">
      <h3>最近</h3>
      <span class="count" id="entryCount"></span>
    </div>
    <div id="entries"></div>
    <div class="more-row" id="moreRow"></div>
  </div>
</main>

<!-- ========== 历 ========== -->
<main class="page" id="page-history" hidden>
  <div class="wrap">
    <div class="year-bar">
      <button class="year-nav" id="yearPrev" aria-label="上一年">‹</button>
      <div class="year-mid">
        <b id="yearLabel">—</b>
        <span id="yearLine"></span>
      </div>
      <button class="year-nav" id="yearNext" aria-label="下一年">›</button>
    </div>
    <div class="legend">
      <span><i class="lg happy"></i>快乐</span>
      <span><i class="lg calm"></i>平静</span>
      <span><i class="lg low"></i>不妙</span>
      <span><i class="lg none"></i>没记</span>
    </div>
    <div id="yearGrid"></div>
    <div class="empty" id="yearEmpty" hidden>这一年还没有记录。</div>
  </div>
</main>

<!-- ========== 我 ========== -->
<main class="page" id="page-me" hidden>
  <div class="wrap">
    <div class="section-h"><h3>这条河</h3></div>
    <div class="me-stats" id="meStats"></div>

    <div class="section-h">
      <h3>云同步</h3>
      <span class="count" id="syncStatus"></span>
    </div>

    <div id="authOut">
      <form class="auth" id="authForm" autocomplete="on">
        <input type="email" id="authEmail" placeholder="邮箱" autocomplete="username" required>
        <input type="password" id="authPass" placeholder="密码（至少 6 位）" autocomplete="current-password" minlength="6" required>
        <div class="row">
          <button type="submit" class="primary" id="signInBtn">登录</button>
          <button type="button" class="ghost" id="signUpBtn">注册新账号</button>
        </div>
      </form>
      <div class="auth-msg" id="authMsg" hidden></div>
    </div>

    <div id="authIn" hidden>
      <p class="me-p">已登录：<b id="authWho"></b></p>
      <div class="row">
        <button class="ghost" id="syncNowBtn">立即同步</button>
        <button class="ghost" id="signOutBtn">退出登录</button>
      </div>
      <div class="hint" id="syncHint"></div>
    </div>

    <div class="section-h"><h3>外观</h3></div>
    <div class="theme-toggle" role="group" aria-label="日间或夜间">
      <button type="button" data-theme-set="light">日</button>
      <button type="button" data-theme-set="dark">夜</button>
      <button type="button" data-theme-set="auto">自动</button>
    </div>
  </div>
</main>

<!-- ========== 底部导航 ========== -->
<nav class="tabbar" id="tabbar">
  <button class="tab on" data-tab="today"><span class="ti">≈</span>河</button>
  <button class="tab" data-tab="history"><span class="ti">▦</span>历</button>
  <button class="tab" data-tab="me"><span class="ti">○</span>我</button>
</nav>

<!-- ========== 底部抽屉 ========== -->
<div class="sheet-back" id="sheet-back"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet-head">
    <h3 id="sheet-title"></h3>
    <button class="sheet-close" id="sheet-close" aria-label="关闭">×</button>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</section>

<div class="toast" id="toast"></div>

<!-- Supabase 客户端：放在本地而不是 CDN，否则离线时装不上 -->
<script src="js/vendor/supabase.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
